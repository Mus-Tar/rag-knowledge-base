[project]
name = "rag-monorepo"
version = "0.1.0"
description = "Development tooling for the local knowledge-base monorepo"
requires-python = ">=3.12,<3.14"
dependencies = []

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/web"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps/api/src", "apps/web/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"apps/*/tests/**/*.py" = ["S101"]
"apps/api/src/rag_api/api/routes/*.py" = ["B008"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["apps/api/tests", "apps/web/tests", "tests/e2e", "tests/evaluation"]
markers = [
  "e2e: requires a running Docker Compose application stack",
]

[tool.coverage.run]
branch = true
source = ["rag_api", "rag_web"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70
