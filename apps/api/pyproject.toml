[project]
name = "rag-api"
version = "0.1.0"
description = "FastAPI backend for the local knowledge base"
requires-python = ">=3.12,<3.14"
dependencies = [
  "chromadb>=1.3,<2",
  "fastapi>=0.116,<1",
  "langchain-core>=1.2,<2",
  "langchain-ollama>=1.0,<2",
  "langchain-openai>=1.1,<2",
  "pydantic-settings>=2.10,<3",
  "pymupdf>=1.26,<2",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
rag-api = "rag_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_api"]
