server {
    listen 80;
    server_name zjt999.zjt666.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/zjt999.zjt666.xyz;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name zjt999.zjt666.xyz;

    ssl_certificate /etc/letsencrypt/live/zjt999.zjt666.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zjt999.zjt666.xyz/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 64m;
    }
}
